# /etc/nginx/sites-available/agora
# HTTP + Socket.io(WebSocket)를 4000번 포트의 Node 프로세스로 프록시한다.
# 도메인 연결 후 certbot --nginx 를 실행하면 이 파일에 SSL 설정이 자동으로 추가된다.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 도메인 연결 시 실제 도메인으로 교체 (예: api.agora.example.com)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Socket.io WebSocket 업그레이드에 필수
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
