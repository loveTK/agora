# /etc/nginx/sites-available/agora-frontend
# myagora.xyz(루트 도메인)에서 agora.html을 정적으로 서빙하기 위한 설정.
# api.myagora.xyz를 처리하는 기존 /etc/nginx/sites-available/agora 파일(nginx.conf)과는
# 별도 파일로 분리한다 — 그 파일은 이미 certbot이 SSL 설정을 추가해놔서 손대지 않는 게 안전하다.
#
# 적용 방법(서버에서):
#   sudo cp deploy/nginx-frontend.conf /etc/nginx/sites-available/agora-frontend
#   sudo ln -sf /etc/nginx/sites-available/agora-frontend /etc/nginx/sites-enabled/agora-frontend
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d myagora.xyz -d www.myagora.xyz   # HTTPS 인증서 추가 발급
server {
    listen 80;
    listen [::]:80;
    server_name myagora.xyz www.myagora.xyz;

    root /home/ubuntu/agora;
    index agora.html;

    location / {
        try_files /agora.html =404;
    }
}
